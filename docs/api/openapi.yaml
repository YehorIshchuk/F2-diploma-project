openapi: 3.0.3
info:
  title: Tax Accounting Platform API
  version: 1.0.0
  description: |
    Публічний контракт платформи податкового обліку для ФОП (Розділ 2.5 пояснювальної записки).
    Охоплює три критичні бізнес-сценарії:
    1. Імпорт банківської виписки (Web SPA → API Gateway → Bank Ingestion & Reconciliation Service).
    2. Розрахунок податкових зобов'язань за період (Web SPA → API Gateway → Tax Engine Service).
    3. Тіньовий перерахунок і звіт «було / стало» після публікації нової версії правил
       (Web SPA → API Gateway → Tax Engine Service).
    4. Публікація перевіреної версії податкових правил конвеєром CI репозиторію правил
       (GitHub Actions → API Gateway → Rules Registry Service).

    Загальні правила:
    - Автентифікація: OAuth 2.0 / OpenID Connect (Keycloak), access token JWT RS256 у заголовку
      `Authorization: Bearer` (SRS-NFR-SEC-01). Підпис перевіряє API Gateway за JWKS, ролі — сервіс (SRS-NFR-SEC-02).
    - Тенант: заголовок `X-Tenant-ID`; сервіс перевіряє членство користувача в тенанті та встановлює
      контекст RLS (SRS-FUN-04).
    - Грошові суми передаються рядком із двома знаками після крапки (`"12345.67"`), щоб уникнути
      втрати точності типу number; на боці БД — NUMERIC(14,2) (SRS-NFR-COR-02).
    - Дати — формат `date` (ISO 8601, `YYYY-MM-DD`), моменти часу — `date-time` з часовим поясом.
    - Помилки повертаються у форматі Problem Details (RFC 9457, `application/problem+json`).
    - Обмеження частоти: 100 запитів/хв на користувача, перевищення → 429 (SRS-NFR-SEC-05).
  contact:
    name: Іщук Є. Т., група 443 А, кафедра ПЗКС ЧНУ
  license:
    name: Proprietary (навчальний проєкт)
    url: https://github.com/YehorIshchuk/F2-diploma-project
servers:
  - url: https://gateway.tax-platform.local
    description: API Gateway (Kong), демонстраційне середовище
security:
  - bearerAuth: []
tags:
  - name: Bank Statements
    description: Bank Ingestion & Reconciliation Service
  - name: Tax Calculations
    description: Tax Engine Service — розрахунок ЄП, ВЗ, ЄСВ
  - name: Shadow Runs
    description: Tax Engine Service — тіньовий перерахунок і аналіз впливу змін правил
  - name: Rule Versions
    description: Rules Registry Service — публікація версій податкових правил

paths:
  /api/v1/bank-statements:
    post:
      tags: [Bank Statements]
      operationId: importBankStatement
      summary: Завантажити файл банківської виписки для асинхронного імпорту
      description: |
        Приймає CSV-файл виписки, зберігає його в MinIO і створює пакет імпорту зі статусом `received`.
        Обробка виконується асинхронно; стан пакета повертає `GET /api/v1/bank-statements/{batchId}`.
        Повторне завантаження того самого файлу (однаковий SHA-256) повертає 409 з ідентифікатором
        наявного пакета (SRS-FUN-08, SRS-FUN-10). Ролі: `owner`, `accountant`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankStatementUpload'
            encoding:
              file:
                contentType: text/csv
      responses:
        '202':
          description: Пакет імпорту створено й поставлено в чергу обробки.
          headers:
            Location:
              description: URI ресурсу пакета імпорту.
              schema:
                type: string
                example: /api/v1/bank-statements/7b0f2a4e-3c1d-4e8a-9f53-2d6c1b9a0e11
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Файл із таким SHA-256 уже імпортовано для тенанта.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DuplicateFileProblem'
        '413':
          description: Розмір файлу перевищує 10 МБ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Непідтримуваний тип файлу (очікується text/csv).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bank-statements/{batchId}:
    get:
      tags: [Bank Statements]
      operationId: getImportBatch
      summary: Отримати стан пакета імпорту
      description: Ролі `owner`, `accountant`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Стан пакета імпорту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tax-calculations:
    post:
      tags: [Tax Calculations]
      operationId: createTaxCalculation
      summary: Запустити розрахунок податкових зобов'язань за період
      description: |
        Створює розрахунок зі статусом `pending` і запускає алгоритм 2.6.2. Якщо для тенанта й періоду
        вже існує завершений розрахунок з ідентичним `input_sha256`, повертається наявний ресурс
        з кодом 200 (ідемпотентність, SRS-FUN-16). Ролі: `owner`, `accountant`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxCalculationRequest'
      responses:
        '200':
          description: Вхідні дані не змінилися; повернуто наявний завершений розрахунок.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCalculation'
        '202':
          description: Розрахунок прийнято до виконання.
          headers:
            Location:
              description: URI ресурсу розрахунку.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Для цього періоду вже виконується розрахунок зі статусом `pending`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Tax Calculations]
      operationId: listTaxCalculations
      summary: Отримати перелік розрахунків тенанта
      description: Курсорна пагінація, сортування за `period_start` у спадному порядку. Ролі `owner`, `accountant`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: period_from
          in: query
          description: Початок діапазону (включно) за `period_start`.
          schema:
            type: string
            format: date
        - name: period_to
          in: query
          description: Кінець діапазону (включно) за `period_start`.
          schema:
            type: string
            format: date
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/CalculationKind'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CalculationStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка розрахунків.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCalculationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tax-calculations/{calculationId}:
    get:
      tags: [Tax Calculations]
      operationId: getTaxCalculation
      summary: Отримати розрахунок із рядками за версіями правил
      description: |
        Повертає підсумки й рядки розрахунку з ідентифікаторами застосованих версій правил
        та хешем вхідних даних, достатніми для відтворення (SRS-FUN-15, SRS-FUN-16). Ролі `owner`, `accountant`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      responses:
        '200':
          description: Розрахунок.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/shadow-runs:
    post:
      tags: [Shadow Runs]
      operationId: createShadowRun
      summary: Запустити тіньовий перерахунок для опублікованої версії правил
      description: |
        Запускає тіньовий перерахунок для всіх тенантів і періодів, яких стосується версія правил
        (SRS-FUN-21). Основні результати не змінюються. Роль: `rules_admin`; заголовок `X-Tenant-ID`
        не використовується.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShadowRunRequest'
      responses:
        '202':
          description: Тіньовий перерахунок поставлено в чергу.
          headers:
            Location:
              description: URI ресурсу тіньового перерахунку.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Версію правил не знайдено в локальній проєкції RULE_SNAPSHOTS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Для цієї версії правил тіньовий перерахунок уже виконується.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/shadow-runs/{shadowRunId}:
    get:
      tags: [Shadow Runs]
      operationId: getShadowRun
      summary: Отримати стан тіньового перерахунку
      description: Роль `rules_admin`.
      parameters:
        - $ref: '#/components/parameters/ShadowRunId'
      responses:
        '200':
          description: Стан тіньового перерахунку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/shadow-runs/{shadowRunId}/diffs:
    get:
      tags: [Shadow Runs]
      operationId: listShadowRunDiffs
      summary: Отримати звіт «було / стало» за тіньовим перерахунком
      description: |
        Повертає лише розрахунки з ненульовою різницею (SRS-FUN-22). Роль `rules_admin` — усі тенанти;
        ролі `owner`, `accountant` — лише тенант із `X-Tenant-ID`.
      parameters:
        - $ref: '#/components/parameters/ShadowRunId'
        - name: X-Tenant-ID
          in: header
          required: false
          description: Обов'язковий для ролей `owner` і `accountant`.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка порівняльного звіту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationDiffPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rule-versions:
    post:
      tags: [Rule Versions]
      operationId: publishRuleVersion
      summary: Опублікувати перевірену версію податкових правил
      description: |
        Викликається лише конвеєром CI репозиторію правил після успішних golden tests (SRS-NFR-COR-01).
        Автентифікація — OAuth 2.0 Client Credentials, роль сервісного облікового запису `rules_publisher`.
        Опублікована версія незмінна (SRS-FUN-20); виправлення наявного періоду реєструється новою
        версією, а попередня отримує `superseded_at` (transaction time, SRS-FUN-19).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRuleVersionRequest'
      responses:
        '201':
          description: Версію правил опубліковано; подію RuleSetPublished записано до outbox.
          headers:
            Location:
              description: URI опублікованої версії правил.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Період дії перетинається з чинною версією без позначки виправлення або версія з таким номером уже існує.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak (JWT, RS256, термін дії 15 хв). Обов'язкові claims: `sub`, `exp`, `iss`,
        `realm_access.roles` (`owner`, `accountant`, `rules_admin`).

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: Ідентифікатор тенанта; сервіс перевіряє членство користувача за локальною проєкцією MEMBERSHIP_SNAPSHOTS (status = active).
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Унікальний ключ запиту клієнта; повтор із тим самим ключем протягом 24 год повертає першу відповідь (зберігається в Redis, ключ idem:{service}:{subject}:{key}).
      schema:
        type: string
        format: uuid
    CalculationId:
      name: calculationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShadowRunId:
      name: shadowRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозорий курсор наступної сторінки з поля `next_cursor`, підписаний HMAC-SHA-256; змінений курсор відхиляється з кодом 400.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Синтаксично некоректний запит (неправильний JSON, формат UUID чи дати).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: Токен відсутній, прострочений або має недійсний підпис.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Роль не дозволяє операцію або користувач не має активного членства в тенанті.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не існує або належить іншому тенанту.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Запит синтаксично коректний, але порушує бізнес-правила (наприклад, period_start не є першим днем періоду).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Перевищено ліміт 100 запитів/хв на користувача.
      headers:
        Retry-After:
          description: Кількість секунд до наступної дозволеної спроби.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутрішня помилка сервісу; деталі — у трасі за `trace_id`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Залежність тимчасово недоступна (PostgreSQL, MinIO або відкритий Circuit Breaker).
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Money:
      type: string
      description: Грошова сума в гривнях; відповідає NUMERIC(14,2).
      pattern: '^-?\d{1,12}\.\d{2}$'
      example: '12345.67'

    Problem:
      type: object
      description: Problem Details (RFC 9457).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://tax-platform.local/problems/calculation-in-progress
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          example: /api/v1/tax-calculations
        trace_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Ідентифікатор траси OpenTelemetry (SRS-NFR-OBS-02).

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                    example: period_start
                  code:
                    type: string
                    example: NOT_PERIOD_START
                  message:
                    type: string

    DuplicateFileProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [existing_batch_id]
          properties:
            existing_batch_id:
              type: string
              format: uuid

    BankStatementUpload:
      type: object
      required: [file, bank_code]
      properties:
        file:
          type: string
          format: binary
          description: CSV-файл виписки, не більше 10 МБ і 10 000 рядків.
        bank_code:
          type: string
          description: Код шаблону розбору виписки.
          enum: [monobank, privatbank, pumb, generic_csv]

    BatchStatus:
      type: string
      enum: [received, processing, completed, failed]

    ImportBatch:
      type: object
      required: [id, source, bank_code, status, file_sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [csv, bank_api]
        bank_code:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/BatchStatus'
        file_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        rows_total:
          type: integer
          minimum: 0
          nullable: true
        rows_imported:
          type: integer
          minimum: 0
          nullable: true
        rows_duplicated:
          type: integer
          minimum: 0
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    PeriodType:
      type: string
      enum: [month, quarter, year]

    CalculationKind:
      type: string
      enum: [primary, shadow]

    CalculationStatus:
      type: string
      enum: [pending, completed, failed, superseded]

    TaxKind:
      type: string
      enum: [single_tax, military_levy, esv]

    CreateTaxCalculationRequest:
      type: object
      additionalProperties: false
      required: [period_type, period_start]
      properties:
        period_type:
          $ref: '#/components/schemas/PeriodType'
        period_start:
          type: string
          format: date
          description: |
            Перший день місяця, кварталу або року. Кінець періоду обчислює сервіс.
            Інакше — 422 з кодом NOT_PERIOD_START.
          example: '2026-01-01'

    CalculationLine:
      type: object
      required: [tax_kind, rule_version_id, applies_from, applies_to, base_amount, amount]
      properties:
        tax_kind:
          $ref: '#/components/schemas/TaxKind'
        rule_version_id:
          type: string
          format: uuid
          description: Версія правил, чинна на дати рядка (SRS-FUN-14).
        applies_from:
          type: string
          format: date
        applies_to:
          type: string
          format: date
        base_amount:
          $ref: '#/components/schemas/Money'
        rate:
          type: string
          pattern: '^\d\.\d{4}$'
          nullable: true
          description: Ставка (NUMERIC(7,4)); null для фіксованих сум.
          example: '0.0500'
        amount:
          $ref: '#/components/schemas/Money'

    TaxCalculation:
      type: object
      required: [id, period_type, period_start, period_end, kind, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        period_type:
          $ref: '#/components/schemas/PeriodType'
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/CalculationKind'
        status:
          $ref: '#/components/schemas/CalculationStatus'
        income_total:
          type: string
          pattern: '^-?\d{1,12}\.\d{2}$'
          nullable: true
          description: Сума в гривнях, NUMERIC(14,2); null, доки статус не completed.
        single_tax:
          type: string
          pattern: '^-?\d{1,12}\.\d{2}$'
          nullable: true
          description: Сума в гривнях, NUMERIC(14,2); null, доки статус не completed.
        military_levy:
          type: string
          pattern: '^-?\d{1,12}\.\d{2}$'
          nullable: true
          description: Сума в гривнях, NUMERIC(14,2); null, доки статус не completed.
        esv:
          type: string
          pattern: '^-?\d{1,12}\.\d{2}$'
          nullable: true
          description: Сума в гривнях, NUMERIC(14,2); null, доки статус не completed.
        input_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: Хеш канонічного подання вхідних даних (SRS-FUN-15).
        failure_code:
          type: string
          nullable: true
          enum: [RULE_NOT_FOUND, PROFILE_NOT_FOUND, RULE_CONFLICT, null]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CalculationLine'
        calculated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    TaxCalculationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaxCalculation'
        next_cursor:
          type: string
          nullable: true

    CreateShadowRunRequest:
      type: object
      additionalProperties: false
      required: [trigger_rule_version_id]
      properties:
        trigger_rule_version_id:
          type: string
          format: uuid

    ShadowRun:
      type: object
      required: [id, trigger_rule_version_id, status]
      properties:
        id:
          type: string
          format: uuid
        trigger_rule_version_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
        tenants_total:
          type: integer
          minimum: 0
          nullable: true
        tenants_processed:
          type: integer
          minimum: 0
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    CalculationDiff:
      type: object
      required: [tenant_id, base_calculation_id, shadow_calculation_id, delta_single_tax, delta_military_levy, delta_esv]
      properties:
        tenant_id:
          type: string
          format: uuid
        base_calculation_id:
          type: string
          format: uuid
        shadow_calculation_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        delta_single_tax:
          $ref: '#/components/schemas/Money'
        delta_military_levy:
          $ref: '#/components/schemas/Money'
        delta_esv:
          $ref: '#/components/schemas/Money'

    CalculationDiffPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalculationDiff'
        next_cursor:
          type: string
          nullable: true

    RuleParameter:
      type: object
      additionalProperties: false
      required: [param_key, value, unit]
      properties:
        param_key:
          type: string
          enum: [rate, fixed_amount, income_limit]
        value:
          type: string
          pattern: '^\d{1,12}(\.\d{1,6})?$'
          description: Значення параметра (NUMERIC(18,6)), передається рядком без втрати точності.
        unit:
          type: string
          enum: [ratio, uah]

    PublishRuleVersionRequest:
      type: object
      additionalProperties: false
      required: [rule_set_code, version_no, valid_from, calc_mode, parameters, legal_basis, git_commit_sha, content_sha256]
      properties:
        rule_set_code:
          type: string
          pattern: '^[a-z_]+(\.g[1-3])?$'
          maxLength: 64
          example: single_tax.g3
        version_no:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date
          description: Перше число місяця, з якого діє версія; інакше 422.
        valid_to:
          type: string
          format: date
          nullable: true
          description: Перше число місяця, з якого версія вже не діє (межа не включається); null — безстроково.
        supersedes_version_no:
          type: integer
          minimum: 1
          nullable: true
          description: Номер версії, яку виправляє ця версія за той самий період; без нього перетин періодів повертає 409.
        calc_mode:
          type: string
          enum: [ratio, fixed_monthly]
        parameters:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RuleParameter'
        legal_basis:
          type: string
          maxLength: 500
        git_commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 канонічного JSON версії; сервер перевіряє збіг перед збереженням.

    RuleVersion:
      type: object
      required: [id, rule_set_code, version_no, valid_from, calc_mode, status, recorded_at]
      properties:
        id:
          type: string
          format: uuid
        rule_set_code:
          type: string
        version_no:
          type: integer
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        calc_mode:
          type: string
          enum: [ratio, fixed_monthly]
        status:
          type: string
          enum: [published, superseded]
        recorded_at:
          type: string
          format: date-time
        superseded_at:
          type: string
          format: date-time
          nullable: true
