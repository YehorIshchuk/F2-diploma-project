extends: existence
message: "Неінженерне або маркетингове формулювання '%s': замініть вимірюваною характеристикою."
level: error
ignorecase: true
nonword: true
tokens:
  - інтуїтивно зрозуміл\w*
  - крут(ий|а|е|і|ого|ому)\b
  - зручн(ий|ого|ому) модул\w*
  - супер\s?швидк\w*
  - легко і просто
  - найкращ(ий|а|е|і) у світі
  - революційн\w*
  - вау-ефект\w*
  - юзер-френдлі
  - user-friendly
